[package]
name         = "fdapquery-physical-plan"
description  = "PhysicalPlan, *Exec operators, physical Expression types, shuffle/task."
edition.workspace      = true
license.workspace      = true
version.workspace      = true
authors.workspace      = true
rust-version.workspace = true

[dependencies]
# We depend on the split arrow-rs crates (arrow-schema, arrow-array) rather than
# the `arrow` umbrella so the `DataType` we name here is *the same* type the
# `datatypes` crate exposes (it also depends on the split crates). Mixing the
# umbrella re-export with the split crates can yield two distinct `DataType`
# types at different versions and a confusing "expected DataType, found DataType"
# error. Matching what logical-plan / sql already do.
arrow-schema  = { workspace = true }
# `arrow-array` provides `ArrayRef` — used by operator bodies after #107
# dropped the `ColumnVector` trait. Several operators (Projection, Filter,
# ShuffleWriter, Aggregate, HashJoin) materialize `ColumnarValue::Array` to
# `ArrayRef` via `into_array(num_rows)`.
arrow-array   = { workspace = true }
# Session 17 #112 — `SortExec` calls into `arrow::compute::{concat_batches,
# lexsort_to_indices, take_record_batch}` (umbrella re-exports of
# `arrow-ord` and `arrow-select`). Matches DataFusion's `SortExec`, which
# pulls the same kernels from the umbrella crate (sort.rs:60).
arrow         = { workspace = true }
# `futures` provides the `Stream` trait — the runtime currency for the new
# `ExecutionPlan::execute` shape returning `SendableRecordBatchStream`.
futures          = { workspace = true }
# `async-stream` provides the `try_stream!` generator macro used by the
# stateful operators (HashAggregateExec, HashJoinExec, LimitExec) to express
# blocking aggregation as a sequential body that .awaits and yields.
async-stream     = { workspace = true }
# `PhysicalPlanner::create_physical_plan` is `async fn`; `async-trait`
# desugars the trait method into a dyn-safe `Pin<Box<dyn Future…>>`
# returning method. Same crate DataFusion uses for the same purpose.
async-trait      = { workspace = true }
# `chrono` provides `DateTime<Utc>` used by the metrics `Timestamp` type.
# Strict mirror of DataFusion's `physical-expr-common::metrics::value::Timestamp`
# (which stores `parking_lot::Mutex<Option<DateTime<Utc>>>`). fdapquery uses
# `std::sync::Mutex` instead of `parking_lot::Mutex` to avoid pulling
# `parking_lot` into the workspace; `DateTime<Utc>` is `Copy` so the
# poisoning paths cannot leave a half-modified state.
#
# The workspace dep has `default-features = false, features = ["std"]`.
# `BaselineMetrics::done()` calls `Utc::now()` (DataFusion does the same),
# which lives behind the `clock` feature, so opt in here.
chrono           = { workspace = true, features = ["clock"] }
fdapquery-datatypes = { version = "0.1.0", path = "../fdapquery-datatypes" }
# `ScalarValue` lives in fdapquery-common; used by `row_key.rs`.
fdapquery-common  = { version = "0.1.0", path = "../fdapquery-common" }
# No `fdapquery-catalog` dep here. The layering is `catalog →
# physical-plan → expr/execution` plus `catalog → datasource →
# physical-plan`. The protobuf serializer and the umbrella planner sit
# on the `catalog + physical-plan` seam instead.
# Session 15c — `TaskContext`/`RuntimeEnv`/`SessionConfig`/`ShuffleManager`/
# `ShuffleLocation` moved into `fdapquery-execution`. The operator trait
# `ExecutionPlan::execute(_, ctx: Arc<TaskContext>)` references this dep;
# `ShuffleReaderExec` / `ShuffleWriterExec` use `ShuffleManager` through it.
# Matches DataFusion's `datafusion-physical-plan` → `datafusion-execution`
# direction.
fdapquery-execution = { version = "0.1.0", path = "../fdapquery-execution" }
fdapquery-expr = { version = "0.1.0", path = "../fdapquery-expr" }
# Phase C / Session 13a: the `Expression` / `AggregateExpression` / `Accumulator`
# traits and every concrete expression type were split out into
# `fdapquery-physical-expr`. Operators here consume them via this path-dep.
# `pub use fdapquery_physical_expr::*` re-exports in `src/lib.rs` keep external
# consumers' `use fdapquery_physical_plan::Expression;` working.
fdapquery-physical-expr = { version = "0.1.0", path = "../fdapquery-physical-expr" }

[dev-dependencies]
# Tests build RecordBatches directly from typed arrow arrays (Int32Array, …)
# rather than going through the `fuzzer` crate. Only the tests touch
# arrow-array directly; the operators go through the `datatypes`
# builder/vector layer.
arrow-array   = { workspace = true }
# Tokio runtime for `#[tokio::test]` — every operator's test drives an async
# stream to completion via `try_collect().await`.
tokio         = { workspace = true }
# No `fdapquery-optimizer` dev-dep. `DefaultPhysicalPlanner` (and its
# `plan_aggregate_query` test) lives in the umbrella `fdapquery` crate;
# the trait-only `physical_planner.rs` here does not reference the
# optimizer.

[lints]
workspace = true
