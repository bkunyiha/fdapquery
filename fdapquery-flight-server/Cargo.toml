[package]
name         = "fdapquery-flight-server"
description  = "Arrow Flight server exposing the query engine over gRPC."
edition.workspace      = true
license.workspace      = true
version.workspace      = true
authors.workspace      = true
rust-version.workspace = true

[dependencies]
# External — Arrow Flight runs on tonic (async gRPC) over a tokio runtime.
arrow            = { workspace = true }
arrow-flight     = { workspace = true }
tonic            = { workspace = true }
tokio            = { workspace = true }
# `futures` for the `Stream` trait that arrow-flight's `FlightService`
# associated types require, plus `futures::stream::iter` (single-result
# response in `do_action`), `StreamExt::map`, and `TryStreamExt::map_err`
# for the `do_get` async pipeline. Post-Phase B no `tokio-stream` /
# `ReceiverStream` — operators are async-native so `do_get` pipes the
# `SendableRecordBatchStream` directly into the Flight encoder without a
# `spawn_blocking` bridge.
futures          = { workspace = true }
# `prost` for direct `Message::decode` / `encode_to_vec` calls on `pb::TaskInfo`
# and `pb::TaskResult` inside `do_action`. arrow-flight already depends on
# prost transitively; declaring it here is the public-API surface our code
# uses directly.
prost            = { workspace = true }

# Internal — eight siblings.
fdapquery-datatypes      = { path = "../fdapquery-datatypes" }
fdapquery-datasource     = { path = "../fdapquery-datasource" }
fdapquery-expr   = { path = "../fdapquery-expr" }
fdapquery-physical-plan  = { path = "../fdapquery-physical-plan" }
fdapquery-sql            = { path = "../fdapquery-sql" }
fdapquery-proto       = { path = "../fdapquery-proto" }
fdapquery-execution      = { path = "../fdapquery-execution" }

# `tracing` for log macros (matches distributed/'s logging choice — both crates
# emit `info!`/`debug!`/`warn!` so a reader graduating to DataFusion source sees
# the same surface). `tracing-subscriber` only consumed by the bin.
tracing            = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow             = { workspace = true }

[dev-dependencies]
# `tokio-stream::wrappers::TcpListenerStream` wraps the bound
# `TcpListener` for `tonic::transport::Server::serve_with_incoming` in
# the integration tests' in-process server spawn. Dev-only — the
# library's `serve(addr, ctx)` binds the listener internally and
# doesn't need this wrapper.
tokio-stream = "0.1"

[[bin]]
name = "fdapquery-flight-server"
path = "src/bin/flight_server.rs"
