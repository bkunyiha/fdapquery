[package]
name         = "fdapquery-execution"
description  = "ExecutionContext and ParallelContext — the runtime entry point."
edition.workspace      = true
license.workspace      = true
version.workspace      = true
authors.workspace      = true
rust-version.workspace = true

[dependencies]
arrow                 = { workspace = true }
# `futures` brings the `Stream` trait and `try_collect`/`try_next` combinators
# the rayon-bound `ParallelContext::execute_parallel_aggregate` needs to drain
# its per-bucket async streams via `futures::executor::block_on`.
futures               = { workspace = true }
rayon                 = { workspace = true }
fdapquery-datatypes      = { path = "../fdapquery-datatypes" }
fdapquery-expr   = { path = "../fdapquery-expr" }
fdapquery-sql            = { path = "../fdapquery-sql" }
fdapquery-physical-plan  = { path = "../fdapquery-physical-plan" }
fdapquery-optimizer      = { path = "../fdapquery-optimizer" }
fdapquery-catalog     = { path = "../fdapquery-catalog" }

[dev-dependencies]
# The Fuzzer-backed ExecutionTest cases (`min max sum float`, `float math`,
# `boolean expressions`, `inner join`, `left join`) construct deterministic
# in-memory batches via `Fuzzer::create_record_batch(schema, columns)`.
fdapquery-fuzzer         = { path = "../fdapquery-fuzzer" }
# Tokio runtime for `#[tokio::test]` — every context test drives an async
# stream to completion via `try_collect().await`.
tokio                 = { workspace = true }
