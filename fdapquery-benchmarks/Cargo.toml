[package]
name         = "fdapquery-benchmarks"
description  = "TPC-H runner and NYC taxi benchmark."
edition.workspace      = true
license.workspace      = true
version.workspace      = true
authors.workspace      = true
rust-version.workspace = true

[dependencies]
# Session 15c — `ExecutionContext` moved from `fdapquery-execution` to
# the `fdapquery` umbrella crate. The binaries now import via
# `use fdapquery::ExecutionContext;`.
fdapquery           = { version = "0.1.0", path = "../fdapquery" }
fdapquery-catalog   = { version = "0.1.0", path = "../fdapquery-catalog" }    # ParquetDataSource (tpch_runner), InMemoryDataSource (benchmarks)
fdapquery-datatypes = { version = "0.1.0", path = "../fdapquery-datatypes" }  # RecordBatch, SchemaConverter, to_csv
# `tokio` for `#[tokio::main]` — the binaries drain the engine's
# `SendableRecordBatchStream` results on the tokio runtime.
tokio        = { workspace = true }
# `futures` for `TryStreamExt::try_collect` plus
# `futures::executor::block_on` (rayon-worker async->sync bridge in
# `benchmarks::execute_query`).
futures      = { workspace = true }
# Data parallelism: `benchmarks` fans out one query per input CSV via
# `into_par_iter().flat_map(...)`.
rayon        = { workspace = true }
# Process-memory stats — used to report RSS / virtual / available memory at
# the start and end of a benchmark run.
sysinfo      = { workspace = true }
anyhow       = { workspace = true }
log          = { workspace = true }
env_logger   = { workspace = true }

[[bin]]
name = "tpch_runner"
path = "src/bin/tpch_runner.rs"

[[bin]]
name = "fdapquery-benchmarks"
path = "src/bin/benchmarks.rs"
