[package]
name         = "fdapquery-flight-server"
description  = "Arrow Flight server exposing the query engine over gRPC."
edition.workspace      = true
license.workspace      = true
version.workspace      = true
authors.workspace      = true
rust-version.workspace = true

[dependencies]
# External — Arrow Flight runs on tonic (async gRPC) over a tokio runtime.
arrow            = { workspace = true }
arrow-flight     = { workspace = true }
tonic            = { workspace = true }
tokio            = { workspace = true }
# `futures` for the `Stream` trait that arrow-flight's `FlightService`
# associated types require, plus `futures::stream::iter` (single-result
# response in `do_action`), `StreamExt::map`, and `TryStreamExt::map_err`
# for the `do_get` async pipeline. Post-Phase B no `tokio-stream` /
# `ReceiverStream` — operators are async-native so `do_get` pipes the
# `SendableRecordBatchStream` directly into the Flight encoder without a
# `spawn_blocking` bridge.
futures          = { workspace = true }
# `prost` for direct `Message::decode` / `encode_to_vec` calls on `protobuf::TaskInfo`
# and `protobuf::TaskResult` inside `do_action`. arrow-flight already depends on
# prost transitively; declaring it here is the public-API surface our code
# uses directly.
prost            = { workspace = true }

# Internal siblings.
# Session 15c — `ExecutionContext` moved to the `fdapquery` umbrella
# crate; `fdap_query_flight_producer.rs` imports it via
# `use fdapquery::ExecutionContext;`.
fdapquery               = { version = "0.1.0", path = "../fdapquery" }
fdapquery-datatypes     = { version = "0.1.0", path = "../fdapquery-datatypes" }
fdapquery-catalog       = { version = "0.1.0", path = "../fdapquery-catalog" }
fdapquery-expr          = { version = "0.1.0", path = "../fdapquery-expr" }
fdapquery-physical-plan = { version = "0.1.0", path = "../fdapquery-physical-plan" }
fdapquery-proto         = { version = "0.1.0", path = "../fdapquery-proto" }
fdapquery-execution     = { version = "0.1.0", path = "../fdapquery-execution" }
# Used by the `flight-server` binary entry point to construct the
# executor-side `RuntimeEnv` via `DistributedConfig::build_runtime_env()`.
# This keeps the cluster-config-to-shuffle-dir wire-up uniform across the
# binary, the integration test, and any future deployment glue — there
# is one place that turns a `shuffle_dir` into a runtime. No cycle:
# `fdapquery-distributed` does not depend on `fdapquery-flight-server`.
fdapquery-distributed   = { version = "0.1.0", path = "../fdapquery-distributed" }

# `tracing` for log macros (matches distributed/'s logging choice — both crates
# emit `info!`/`debug!`/`warn!` so a reader graduating to DataFusion source sees
# the same surface). `tracing-subscriber` only consumed by the bin.
tracing            = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
# `tokio-stream::wrappers::TcpListenerStream` wraps the bound
# `TcpListener` for `tonic::transport::Server::serve_with_incoming` in
# the integration tests' in-process server spawn. Dev-only — the
# library's `serve(addr, ctx)` binds the listener internally and
# doesn't need this wrapper.
tokio-stream = "0.1"

[[bin]]
name = "fdapquery-flight-server"
path = "src/bin/flight_server.rs"

[lints]
workspace = true
