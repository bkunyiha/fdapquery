[package]
name         = "fdapquery"
description  = "Umbrella crate. Re-exports the user-facing surface of the fdapquery query engine. Mirrors DataFusion's `datafusion` umbrella."
edition.workspace      = true
license.workspace      = true
version.workspace      = true
authors.workspace      = true
rust-version.workspace = true

[dependencies]
# Session 15c — `ExecutionContext` / `ParallelContext` moved here
# from `fdapquery-execution`, so the umbrella now needs `arrow`,
# `futures`, and `rayon` directly.
arrow                         = { workspace = true }
futures                       = { workspace = true }
rayon                         = { workspace = true }
fdapquery-catalog             = { version = "0.1.0", path = "../fdapquery-catalog" }
fdapquery-common              = { version = "0.1.0", path = "../fdapquery-common" }
fdapquery-datatypes           = { version = "0.1.0", path = "../fdapquery-datatypes" }
fdapquery-execution           = { version = "0.1.0", path = "../fdapquery-execution" }
fdapquery-expr                = { version = "0.1.0", path = "../fdapquery-expr" }
fdapquery-functions           = { version = "0.1.0", path = "../fdapquery-functions" }
fdapquery-functions-aggregate = { version = "0.1.0", path = "../fdapquery-functions-aggregate" }
fdapquery-optimizer           = { version = "0.1.0", path = "../fdapquery-optimizer" }
fdapquery-physical-expr       = { version = "0.1.0", path = "../fdapquery-physical-expr" }
fdapquery-physical-plan       = { version = "0.1.0", path = "../fdapquery-physical-plan" }
fdapquery-sql                 = { version = "0.1.0", path = "../fdapquery-sql" }

[dev-dependencies]
# Session 15c — moved here from `fdapquery-execution` alongside
# `ExecutionContext`/`ParallelContext`. Fuzzer-backed tests build
# in-memory batches; tokio drives the async stream test bodies.
fdapquery-fuzzer = { version = "0.1.0", path = "../fdapquery-fuzzer" }
tokio            = { workspace = true }
# Session 15d-1 #95 — tests use `arrow_schema::DataType::*` directly
# (now that the `arrow_types` re-export module is gone) for constructing
# test `Field`s and `cast(...)` arguments.
arrow-schema     = { workspace = true }
