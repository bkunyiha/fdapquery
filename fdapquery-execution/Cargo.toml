[package]
name         = "fdapquery-execution"
description  = "Low-level runtime types: TaskContext, RuntimeEnv, SessionConfig, ShuffleManager."
edition.workspace      = true
license.workspace      = true
version.workspace      = true
authors.workspace      = true
rust-version.workspace = true

[dependencies]
# Session 15c — this crate now holds only the low-level per-task runtime
# types (`TaskContext`, `RuntimeEnv`, `SessionConfig`) and the per-process
# runtime resources they own (`ShuffleManager`, `ShuffleLocation`). The
# high-level `ExecutionContext` / `ParallelContext` API moved out to the
# `fdapquery` umbrella crate (matches DataFusion's split of
# `datafusion-execution` (low-level) and `datafusion` (high-level
# `SessionContext`)). The heavy-weight deps that used to live here
# (`fdapquery-physical-plan`, `-expr`, `-sql`, `-optimizer`, `-catalog`,
# `arrow`, `futures`, `rayon`) moved to the umbrella alongside the code
# that needed them.
#
# `arrow-ipc` powers `ShuffleManager`'s local Arrow IPC file
# writer/reader. `fdapquery-datatypes` supplies `RecordBatch` / `Result`.
arrow-ipc           = { workspace = true }
# Session 15d-1 #92 — `stream.rs` moved from physical-plan to here so
# `SendableRecordBatchStream` lives at its DataFusion-canonical
# location (`datafusion-execution::stream`). Pulls in arrow-schema for
# `SchemaRef`, futures for the `Stream` trait, and pin-project-lite
# for the safe pin-projection inside `RecordBatchStreamAdapter`.
arrow-schema        = { workspace = true }
futures             = { workspace = true }
pin-project-lite    = { workspace = true }
fdapquery-datatypes = { version = "0.1.0", path = "../fdapquery-datatypes" }

[dev-dependencies]
# `shuffle_manager.rs`'s standalone round-trip test builds in-memory
# arrow batches directly (`Int32Array`, `StringArray`, `ArrowSchema`)
# rather than going through `fdapquery-datatypes`'s converters.
# Only the test code touches these crates; the runtime types use
# `fdapquery_datatypes::RecordBatch`.
arrow-array         = { workspace = true }
# Session 15d-1 #92 — `stream.rs` moved here with its tokio-driven tests.
tokio               = { workspace = true }
