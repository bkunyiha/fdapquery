[package]
name         = "fdapquery-examples"
description  = "Worked example binaries — NYC taxi, parallel query, distributed."
edition.workspace      = true
license.workspace      = true
version.workspace      = true
authors.workspace      = true
rust-version.workspace = true

[dependencies]
# Session 15c — `ExecutionContext` and `ParallelContext` moved from
# `fdapquery-execution` to the `fdapquery` umbrella crate. The example
# binaries now import via `use fdapquery::{ExecutionContext, ParallelContext};`.
fdapquery           = { version = "0.1.0", path = "../fdapquery" }
fdapquery-catalog   = { version = "0.1.0", path = "../fdapquery-catalog" }    # InMemoryDataSource for parallel_query
fdapquery-common    = { version = "0.1.0", path = "../fdapquery-common" }     # ScalarValue (lives here per #108)
fdapquery-datatypes = { version = "0.1.0", path = "../fdapquery-datatypes" }  # RecordBatch, arrow_types
fdapquery-expr      = { version = "0.1.0", path = "../fdapquery-expr" }       # col, cast, max, format, …
fdapquery-optimizer = { version = "0.1.0", path = "../fdapquery-optimizer" }     # Optimizer used by nyc_taxi
# `distributed_flight_example` uses the distributed stack via
# `SessionContext::standalone()` from `fdapquery-flight-client`'s
# `SessionContextExt`. That constructor spawns the in-process Flight
# server internally, so this crate no longer needs `arrow-flight`,
# `tonic`, or `tokio-stream` directly (they were previously used by
# the hand-rolled `spawn_in_process_server` helper — folded into
# `fdapquery_flight_server::standalone` in Session 20d).
# `standalone` feature enables `SessionContext::standalone()`.
fdapquery-flight-client = { version = "0.1.0", path = "../fdapquery-flight-client", features = ["standalone"] }
# `nyc_taxi` constructs cast types via
# `arrow_schema::DataType::Float32` directly.
arrow-schema    = { workspace = true }
tokio           = { workspace = true }
# `futures` for `TryStreamExt::try_collect` (drain the
# `SendableRecordBatchStream` results) and
# `futures::executor::block_on` (rayon-worker async->sync bridge in
# `parallel_query`).
futures         = { workspace = true }
# Data parallelism: `parallel_query` fans out 12 monthly CSV queries via
# `(1..=12).into_par_iter()`.
rayon           = { workspace = true }
# `log` for progress breadcrumbs — mirrors DataFusion `datafusion-examples`
# pattern (e.g. `data_io/catalog.rs`'s `log::info!("adding table X")`
# breadcrumbs). Primary example output stays on `println!` for the
# pedagogical value; background events (server bind, shuffle-dir setup)
# route through `log::info!` so `RUST_LOG=info` controls verbosity.
# `env_logger` wires the facade to stderr from the binary entry points.
log             = { workspace = true }
env_logger      = { workspace = true }

[[bin]]
name = "nyc_taxi"
path = "src/bin/nyc_taxi.rs"

[[bin]]
name = "parallel_query"
path = "src/bin/parallel_query.rs"

[[bin]]
name = "parallel_execution_example"
path = "src/bin/parallel_execution_example.rs"

[[bin]]
name = "distributed_flight_example"
path = "src/bin/distributed_flight_example.rs"

[lints]
workspace = true
