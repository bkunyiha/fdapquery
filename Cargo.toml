# rquery — workspace manifest
#
# Faithful Rust port of `kquery`, the Kotlin query engine from Andy Grove's
# "How Query Engines Work" (2nd edition). See README.md for the full context.
[workspace]
resolver = "2"
# 20 crates. Build order matches the listing order below.
members = [
    "fdapquery-common",
    "fdapquery-datatypes",
    "fdapquery-datasource",
    "fdapquery-catalog",
    "fdapquery-expr",
    "fdapquery-sql",
    "fdapquery-optimizer",
    "fdapquery-physical-expr",
    "fdapquery-physical-plan",
    "fdapquery-physical-optimizer",
    "fdapquery-execution",
    "fdapquery-functions",
    "fdapquery-functions-aggregate",
    "fdapquery-fuzzer",
    "fdapquery-examples",
    "fdapquery-benchmarks",
    "fdapquery-proto",
    "fdapquery-flight-server",
    "fdapquery-flight-client",
    "fdapquery-distributed",
    "fdapquery",
]

[workspace.package]
edition       = "2024"
license       = "Apache-2.0"
version       = "0.1.0"
repository    = "https://github.com/bkunyiha/fdapquery"
authors       = ["Bill Kunyiha <bkunyiha@gmail.com>"]
rust-version  = "1.85"

[workspace.dependencies]
# arrow-rs and parquet — pin the major; let cargo update the minor.
arrow         = "59"
arrow-array   = "59"
# arrow-data exposes `ArrayData`, used by
# `fdapquery_common::utils::memory::get_record_batch_memory_size` to walk
# a `RecordBatch`'s buffers and compute its physical memory footprint
# (strict mirror of `datafusion_common::utils::memory`).
arrow-data    = "59"
arrow-schema  = "59"
arrow-flight  = "59"
# Arrow IPC reader/writer — used by `physical-plan::ShuffleManager` to
# serialise per-partition shuffle output to local files.
arrow-ipc     = "59"
parquet       = "59"

# Data-parallelism — used by `ParallelContext` for CPU-bound work on a
# work-stealing thread pool. NOT tokio (tokio is for I/O-bound concurrency).
rayon         = "1"

# Random number generation — used by the `fuzzer` crate for differential
# testing. `StdRng::seed_from_u64(0)` provides deterministic seeding.
rand          = "0.10"

# Date / time — `chrono::NaiveDate` is used for `LiteralDate` in
# `logical-plan`, the SQL planner's date-literal parse, and the
# `query-planner` date-to-days lowering.
chrono        = { version = "0.4", default-features = false, features = ["std"] }

# Process / system info — used by the `benchmarks` crate to print process
# memory stats at the start and end of a run.
sysinfo       = { version = "0.36", default-features = false, features = ["system"] }

# RPC and serialisation — needed only by protobuf / flight-server / client / distributed.
prost         = "0.14"
tonic         = "0.14"

# SQL parser — `sqlparser-rs` powers the `fdapquery-sql` crate's frontend.
# Same version and feature set as DataFusion pins at
# `datafusion/Cargo.toml:197` so fdapquery-sql accepts exactly the SQL surface
# DataFusion accepts (see `SESSION-17-PLAN.md`, `DESIGN.md:1043`).
sqlparser     = { version = "0.62.0", default-features = false, features = ["std", "visitor"] }

# Error handling.
anyhow        = "1"
thiserror     = "2"

# Logging
log           = "0.4"
env_logger    = "0.11"
# `tracing` is DataFusion's logging choice. Used by `distributed/` so readers
# see the same macro names (`info!`/`debug!`/`warn!`) used by DataFusion.
tracing       = "0.1"
# `tracing-subscriber` is the consumer side — only needed by binaries that initialise
# the global subscriber. Added at workspace level so `flight-server`'s bin and any
# future bins can pick it up consistently.
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Async runtime — required by `flight-server` (the Arrow Flight server runs on tonic,
# which is async-native). Kept minimal in features: rt-multi-thread for the worker
# pool, macros for `#[tokio::main]`, sync for `mpsc` channels used in the
# sync->async bridge inside `do_get`.
#
# NOTE: This does NOT contradict the rayon-not-tokio rule above. Rayon is for
# CPU-bound operator execution inside `ParallelContext`; tokio is for
# I/O-bound gRPC handling at the Flight boundary. The two coexist: operator
# threads use rayon, Flight server I/O uses tokio.
tokio         = { version = "1", features = ["rt-multi-thread", "macros", "sync", "net"] }

# `futures` provides the `Stream` trait that arrow-flight's `FlightService` associated
# types require. `tokio-stream` (added when we need `ReceiverStream` in batch E) sits
# on top of `futures-core`; pulling `futures` keeps both surfaces available.
futures       = "0.3"

# `pin-project-lite` provides the `pin_project!` macro for safe pin-projection
# in custom Stream wrappers (e.g. `RecordBatchStreamAdapter`). Same shape and
# version DataFusion uses.
pin-project-lite = "0.2"

# `async-stream` provides the `try_stream!` macro for writing stateful operators
# as sequential-style generators that .await on input batches and yield output
# batches. Used by `HashAggregateExec`, `HashJoinExec`, and `LimitExec`. Same
# crate DataFusion uses for the same pattern.
async-stream = "0.3"

# `async-trait` enables `async fn` methods on the `ExecutorClient` trait so
# `dyn ExecutorClient` remains dyn-safe (the macro desugars
# `async fn foo() -> T` into `fn foo() -> Pin<Box<dyn Future<Output = T>>>`,
# which has a stable vtable). DataFusion / Ballista use the same crate for
# `BallistaClient`.
async-trait  = "0.1"

# UUID generation — used by `distributed::Scheduler` to mint a fresh
# `job_uuid` per query.
uuid          = { version = "1", features = ["v4"] }

# Testing helpers
pretty_assertions = "1"

# =============================================================================
# Workspace-wide lints.
#
# We start with rustc's `warn`-by-default plus `clippy::pedantic` to surface
# every idiomatic-Rust improvement opportunity at workspace scope. Lints that
# either (a) conflict with the strict-mirror-DataFusion discipline, (b) produce
# noise without finding real bugs in this domain, or (c) we'd accept on a
# per-site basis but not workspace-wide, are explicitly allowed below.
#
# Once the workspace is clean under this configuration, every PR is auto-
# protected against regressions on these lints via `cargo clippy --workspace
# --all-targets -- -D warnings`.
#
# Members opt in via:
#     [lints]
#     workspace = true
# in each crate's `Cargo.toml`.
# =============================================================================
[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }

# Domain-style allowances — these pedantic lints fire on patterns we
# deliberately use throughout the codebase.

# Module name in type name is fine for domain types (e.g. `expressions::Expr`).
module_name_repetitions = "allow"
# `#[must_use]` on every constructor/getter is noisy and doesn't catch bugs.
must_use_candidate = "allow"
# Casts that can lose precision are often deliberate in numeric/Arrow paths.
# Each cast site is still subject to review during code review.
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
# Float comparisons in tests are usually fine.
float_cmp = "allow"
# `arrow::compute::*` style wildcard imports are idiomatic in the engine.
wildcard_imports = "allow"
# Domain types reasonably share name stems (e.g. `Expr`, `Expression`).
similar_names = "allow"
# Doc nits — not worth gating CI on.
missing_errors_doc = "allow"
missing_panics_doc = "allow"
doc_markdown = "allow"
# A function with many branches in a tree-walking lowering is fine.
too_many_lines = "allow"
# Closures of one line for `.map(|x| Foo::new(x))` are common.
redundant_closure_for_method_calls = "allow"
# 68 sites — builder/setter methods that return `Self`. Marking each with
# `#[must_use]` is mechanical noise without finding real bugs in this codebase's
# chain-immediately call patterns; DataFusion's equivalent builders aren't
# marked either.
return_self_not_must_use = "allow"
