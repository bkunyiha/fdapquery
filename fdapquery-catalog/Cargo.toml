[package]
name         = "fdapquery-catalog"
description  = "DataSource trait with CSV, Parquet, and in-memory implementations."
edition.workspace      = true
license.workspace      = true
version.workspace      = true
authors.workspace      = true
rust-version.workspace = true

[dependencies]
arrow        = { workspace = true }
arrow-array  = { workspace = true }
arrow-schema = { workspace = true }
parquet      = { workspace = true }
# `futures::stream` (Session 13b) — `TableProvider::scan` returns a
# `Pin<Box<dyn Stream<Item = Result<RecordBatch>>>>`, modernizing the
# pre-13b sync `Iterator` return shape.
futures      = { workspace = true }
fdapquery-datatypes = { version = "0.1.0", path = "../fdapquery-datatypes" }
# Session 15d-1 #92 — `SendableRecordBatchStream` moved to
# `fdapquery-execution`; catalog imports it from there so
# `TableProvider::scan` uses the canonical type rather than a local
# `BoxRecordBatchStream` alias.
fdapquery-execution = { version = "0.1.0", path = "../fdapquery-execution" }

[dev-dependencies]
# Tokio runtime for the per-provider `#[tokio::test]` test bodies that
# drain the `TableProvider::scan` stream via `try_collect().await`.
tokio = { workspace = true }
