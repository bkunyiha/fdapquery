[package]
name         = "fdapquery-physical-plan"
description  = "PhysicalPlan, *Exec operators, physical Expression types, shuffle/task."
edition.workspace      = true
license.workspace      = true
version.workspace      = true
authors.workspace      = true
rust-version.workspace = true

[dependencies]
# We depend on the split arrow-rs crates (arrow-schema, arrow-array) rather than
# the `arrow` umbrella so the `DataType` we name here is *the same* type the
# `datatypes` crate exposes (it also depends on the split crates). Mixing the
# umbrella re-export with the split crates can yield two distinct `DataType`
# types at different versions and a confusing "expected DataType, found DataType"
# error. Matching what logical-plan / sql already do.
arrow-schema  = { workspace = true }
# `arrow-ipc` powers `ShuffleManager`'s local Arrow IPC file writer/reader.
arrow-ipc     = { workspace = true }
# `futures` provides the `Stream` trait — the runtime currency for the new
# `ExecutionPlan::execute` shape returning `SendableRecordBatchStream`.
futures          = { workspace = true }
# `pin-project-lite` powers safe pin-projection in `RecordBatchStreamAdapter`.
pin-project-lite = { workspace = true }
# `async-stream` provides the `try_stream!` generator macro used by the
# stateful operators (HashAggregateExec, HashJoinExec, LimitExec) to express
# blocking aggregation as a sequential body that .awaits and yields.
async-stream     = { workspace = true }
fdapquery-datatypes     = { path = "../fdapquery-datatypes" }
fdapquery-datasource    = { path = "../fdapquery-datasource" }
fdapquery-expr  = { path = "../fdapquery-expr" }

[dev-dependencies]
# Tests build RecordBatches directly from typed arrow arrays (Int32Array, …)
# rather than going through the `fuzzer` crate. Only the tests touch
# arrow-array directly; the operators go through the `datatypes`
# builder/vector layer.
arrow-array   = { workspace = true }
# Tokio runtime for `#[tokio::test]` — every operator's test drives an async
# stream to completion via `try_collect().await`.
tokio         = { workspace = true }
