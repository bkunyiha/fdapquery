[package]
name         = "fdapquery-examples"
description  = "Worked example binaries — NYC taxi, parallel query, distributed."
edition.workspace      = true
license.workspace      = true
version.workspace      = true
authors.workspace      = true
rust-version.workspace = true

[dependencies]
fdapquery-execution       = { path = "../fdapquery-execution" }
fdapquery-datasource      = { path = "../fdapquery-datasource" }    # InMemoryDataSource for parallel_query
fdapquery-datatypes       = { path = "../fdapquery-datatypes" }     # RecordBatch, ScalarValue, arrow_types
fdapquery-expr    = { path = "../fdapquery-expr" }  # col, cast, max, format, …
fdapquery-optimizer       = { path = "../fdapquery-optimizer" }     # Optimizer used by nyc_taxi
# `distributed_example` and `distributed_flight_example` use the distributed
# stack. The former impls `ExecutorClient` directly; the latter uses
# `FlightExecutorClient` from the `client` crate against an in-process
# `flight-server`.
fdapquery-distributed     = { path = "../fdapquery-distributed" }
fdapquery-physical-plan   = { path = "../fdapquery-physical-plan" }
fdapquery-client          = { path = "../fdapquery-client" }
fdapquery-flight-server   = { path = "../fdapquery-flight-server" }
# Used by `distributed_flight_example` to spawn the in-process tonic server
# and bind a random TCP port — same pattern as
# `client/tests/distributed_integration_test.rs`.
arrow-flight    = { workspace = true }
tonic           = { workspace = true }
tokio           = { workspace = true }
tokio-stream    = "0.1"
# `async-trait` so `distributed_example` can `#[async_trait]
# impl ExecutorClient for LocalExecutorClient`.
async-trait     = { workspace = true }
# `futures` for `TryStreamExt::try_collect` (drain the
# `SendableRecordBatchStream` results) and
# `futures::executor::block_on` (rayon-worker async->sync bridge in
# `parallel_query`).
futures         = { workspace = true }
# Data parallelism: `parallel_query` fans out 12 monthly CSV queries via
# `(1..=12).into_par_iter()`.
rayon           = { workspace = true }
log             = { workspace = true }
env_logger      = { workspace = true }
anyhow          = { workspace = true }

[[bin]]
name = "nyc_taxi"
path = "src/bin/nyc_taxi.rs"

[[bin]]
name = "parallel_query"
path = "src/bin/parallel_query.rs"

[[bin]]
name = "parallel_execution_example"
path = "src/bin/parallel_execution_example.rs"

[[bin]]
name = "distributed_example"
path = "src/bin/distributed_example.rs"

[[bin]]
name = "distributed_flight_example"
path = "src/bin/distributed_flight_example.rs"
