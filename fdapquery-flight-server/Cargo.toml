[package]
name         = "fdapquery-flight-server"
description  = "Arrow Flight server exposing the query engine over gRPC."
edition.workspace      = true
license.workspace      = true
version.workspace      = true
authors.workspace      = true
rust-version.workspace = true

[dependencies]
# External — Arrow Flight runs on tonic (async gRPC) over a tokio runtime.
arrow            = { workspace = true }
arrow-flight     = { workspace = true }
tonic            = { workspace = true }
tokio            = { workspace = true }
# `futures` for the `Stream` trait that arrow-flight's `FlightService` associated
# types require, plus `futures::stream::iter` used to wrap the single-result
# response in `do_action`. `tokio-stream` for `ReceiverStream` (used by the
# sync->async bridge in `do_get`).
futures          = { workspace = true }
tokio-stream     = "0.1"
# `prost` for direct `Message::decode` / `encode_to_vec` calls on `pb::TaskInfo`
# and `pb::TaskResult` inside `do_action`. arrow-flight already depends on
# prost transitively; declaring it here is the public-API surface our code
# uses directly.
prost            = { workspace = true }

# Internal — eight siblings.
fdapquery-datatypes      = { path = "../fdapquery-datatypes" }
fdapquery-datasource     = { path = "../fdapquery-datasource" }
fdapquery-logical-plan   = { path = "../fdapquery-logical-plan" }
fdapquery-physical-plan  = { path = "../fdapquery-physical-plan" }
fdapquery-query-planner  = { path = "../fdapquery-query-planner" }
fdapquery-sql            = { path = "../fdapquery-sql" }
fdapquery-protobuf       = { path = "../fdapquery-protobuf" }
fdapquery-execution      = { path = "../fdapquery-execution" }

# `tracing` for log macros (matches distributed/'s logging choice — both crates
# emit `info!`/`debug!`/`warn!` so a reader graduating to DataFusion source sees
# the same surface). `tracing-subscriber` only consumed by the bin.
tracing            = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow             = { workspace = true }

[[bin]]
name = "fdapquery-flight-server"
path = "src/bin/flight_server.rs"
