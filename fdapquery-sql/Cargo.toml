[package]
name         = "fdapquery-sql"
description  = "SQL→LogicalPlan compiler built on `sqlparser-rs`, mirroring `datafusion-sql`."
edition.workspace      = true
license.workspace      = true
version.workspace      = true
authors.workspace      = true
rust-version.workspace = true

[dependencies]
arrow-schema = { workspace = true }
chrono       = { workspace = true }      # NaiveDate::parse for Date literal lowering
sqlparser    = { workspace = true }      # SQL frontend — same crate DataFusion uses

fdapquery-common    = { version = "0.1.0", path = "../fdapquery-common" }   # ScalarValue
fdapquery-datatypes = { version = "0.1.0", path = "../fdapquery-datatypes" }
fdapquery-expr      = { version = "0.1.0", path = "../fdapquery-expr" }

[dev-dependencies]
# The `SqlToRel` unit tests under `tests/` build fixture `DataFrame`s from
# `InMemoryDataSource` (a `TableProvider`) wrapped through `provider_as_source`.
# Both live in `fdapquery-catalog`. There is no back-edge from catalog to sql,
# so this dep is acyclic. Test-only, so it stays out of the production graph.
fdapquery-catalog = { version = "0.1.0", path = "../fdapquery-catalog" }

[lints]
workspace = true
