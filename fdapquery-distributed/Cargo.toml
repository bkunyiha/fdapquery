[package]
name         = "fdapquery-distributed"
description  = "Distributed query execution: scheduler, query stages, distributed planner."
edition.workspace      = true
license.workspace      = true
version.workspace      = true
authors.workspace      = true
rust-version.workspace = true

[dependencies]
# External
# `async-trait` is required to declare `async fn` methods on the
# `ExecutorClient` trait — `dyn ExecutorClient` needs a stable vtable
# shape, and `async fn` in trait isn't dyn-safe without the macro
# (matches DataFusion's `BallistaClient` shape).
# `futures` provides the empty stream + `RecordBatchStreamAdapter`
# constructors used by the test mocks.
# `tracing` matches DataFusion's logging idiom.
# `uuid` mints fresh `job_uuid` strings via `Uuid::new_v4()`.
# No `arrow-flight` or `protobuf` dep — the Flight transport lives behind the
# `ExecutorClient` trait (in `scheduler.rs`), whose implementation lives in
# `flight-server` / `client`.
async-trait    = { workspace = true }
futures        = { workspace = true }
tracing        = { workspace = true }
uuid           = { workspace = true }

# Internal siblings:
#   - datasource (CsvDataSource in DistributedContext)
#   - datatypes (RecordBatch return type)
#   - logical-plan (LogicalPlan/Scan, DataFrame for the context facade)
#   - physical-plan (PhysicalPlan / ShuffleLocation / Task / ShuffleWriterExec /
#     ShuffleReaderExec / HashAggregateExec / AggregateMode — used by DistributedPlanner)
#   - optimizer (Optimizer in DistributedContext.execute)
#   - query-planner (QueryPlanner in DistributedContext.execute)
#   - sql (SqlParser / SqlPlanner / SqlSelect / SqlTokenizer in DistributedContext.sql)
# `execution` is intentionally NOT a dependency — `DistributedContext`
# re-implements the registry / SQL parse pipeline rather than reusing
# `ExecutionContext`.
fdapquery-catalog     = { path = "../fdapquery-catalog" }
fdapquery-datatypes      = { path = "../fdapquery-datatypes" }
fdapquery-expr   = { path = "../fdapquery-expr" }
fdapquery-physical-plan  = { path = "../fdapquery-physical-plan" }
fdapquery-optimizer      = { path = "../fdapquery-optimizer" }
fdapquery-sql            = { path = "../fdapquery-sql" }

[dev-dependencies]
# Tokio runtime for `#[tokio::test]` — the scheduler-against-mock test
# drives the async `execute()` future on the test runtime.
tokio          = { workspace = true }
